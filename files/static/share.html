<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2e58">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>HEHE网盘</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/app.css?v=4">
</head>
<body>
  <section class="share-page" id="sharePage">
    <header class="share-head">
      <img class="brand-avatar" src="/avatar.jpg" alt="">
      <span class="brand-name">HEHE网盘</span>
    </header>

    <main class="share-main">
      <p class="share-loading" id="shareLoading">正在读取分享…</p>

      <div id="shareErrorView" hidden>
        <p class="share-error-text" id="shareErrorText"></p>
      </div>

      <form class="share-code-form" id="shareCodeForm" hidden novalidate>
        <h1 class="share-name">需要共享码</h1>
        <p class="share-sub">这个分享需要共享码，请向分享者索取</p>
        <label class="sr-only" for="shareCodeInput">共享码</label>
        <input class="text-input" id="shareCodeInput" type="text" placeholder="输入共享码"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <p class="form-error" id="shareCodeError" role="alert" hidden></p>
        <button class="primary-btn" id="shareCodeBtn" type="submit">打开</button>
      </form>

      <div class="share-browser" id="shareBrowser" hidden>
        <div class="share-browser-head">
          <h1 class="share-name" id="shareBrowserName"></h1>
          <nav class="breadcrumb" id="shareBreadcrumb" aria-label="当前路径"></nav>
        </div>
        <div class="entry-list" id="shareEntryList"></div>
        <p class="empty-state" id="shareEmpty" hidden>这个文件夹是空的</p>
        <p class="share-download-hint">点文件夹进入，点图片预览，点其他文件下载</p>
      </div>
    </main>
  </section>

  <!-- 图片预览 -->
  <div class="modal-overlay" id="previewModal" hidden>
    <div class="modal-card preview-card" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="previewTitle">预览</h2>
        <button class="icon-btn modal-close" id="previewClose" type="button" aria-label="关闭预览">×</button>
      </div>
      <div class="preview-body">
        <img id="previewImg" alt="">
      </div>
      <div class="modal-actions">
        <button class="ghost-btn" id="previewDownload" type="button">下载原图</button>
        <button class="primary-btn small" id="previewDone" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script src="/share.js?v=4"></script>
</body>
</html>
