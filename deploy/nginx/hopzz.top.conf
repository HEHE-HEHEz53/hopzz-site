# =====================================================================
# hopzz.top —— Nginx 站点配置（HTTPS 版）
# 安装位置：/etc/nginx/sites-available/hopzz.top.conf
#           并 ln -s 到 /etc/nginx/sites-enabled/
# =====================================================================

# ---------- 1. 80 端口：只做两件事 ----------
#   a) 给 Let's Encrypt 续期验证放行 /.well-known/acme-challenge/
#   b) 其余全部 301 跳到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hopzz.top www.hopzz.top;

    # 证书续期验证目录（certbot --webroot 会往这里写文件）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 2. 443 端口：真正的站点 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hopzz.top www.hopzz.top;

    # ---- 证书（certbot 自动续期后会更新这两个文件，无需重启 nginx）----
    ssl_certificate     /etc/letsencrypt/live/hopzz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hopzz.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- 站点根目录（静态文件）----
    root /var/www/hopzz.top;
    index index.html;

    charset utf-8;

    # ---- 一些基础安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml text/xml;

    # ---- 后端 API：反向代理到本机 8000 端口的 FastAPI ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 访问 /api 时自动跳到接口文档
    location = /api {
        return 301 /api/docs;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- 其余交给静态文件，找不到就回首页 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件不对外
    location ~ /\.(?!well-known) {
        deny all;
    }
}
