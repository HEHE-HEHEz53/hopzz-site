<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" id="metaTheme" content="#171426">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="same-origin">
  <title>鲸鱼娘在线</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb3d1'/%3E%3Cstop offset='.55' stop-color='%23b8a4ff'/%3E%3Cstop offset='1' stop-color='%238fe3ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M14 33c3.5-6 10-9 17-9s13.5 3 17 9c-3.5 6-10 9-17 9s-13.5-3-17-9Z' fill='none' stroke='%232a1738' stroke-width='3.4' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='32' r='2' fill='%232a1738'/%3E%3Cpath d='M28 39c2 1.4 4.6 1.4 6.6 0' fill='none' stroke='%232a1738' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body>
  <!-- 手绘小鲸鱼（头像 / 装饰共用） -->
  <svg class="svg-sprite" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="whale-icon" viewBox="0 0 24 24">
      <path d="M2.6 12.7c1.7-3 4.9-4.7 8.8-4.7s7.1 1.7 8.8 4.7c-1.7 3-4.9 4.7-8.8 4.7S4.3 15.7 2.6 12.7Z"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M20.2 12.7c1.2-.5 2-1.4 2.4-2.7-1.6.1-2.7.9-3.4 2.1M20.2 12.7c1.2.5 2 1.4 2.4 2.7-1.6-.1-2.7-.9-3.4-2.1"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7.2" cy="12.1" r=".95" fill="currentColor"/>
      <path d="M8.8 15.1c.8.5 1.8.5 2.6 0" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5.9 8.6c-.1-1-.5-1.7-1.2-2.2M7.3 8.3c.2-.9.7-1.5 1.5-1.9"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M3.2 5.6c.5-.5 1.1-.5 1.6 0" fill="none" stroke="currentColor"
            stroke-width="1.2" stroke-linecap="round"/>
    </symbol>
  </svg>

  <noscript><p class="noscript">请开启 JavaScript 后使用。</p></noscript>

  <!-- ===== 登录页 ===== -->
  <section class="view login-view" id="loginView" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-mark" aria-hidden="true">
        <svg class="whale-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="#whale-icon"></use>
        </svg>
      </div>
      <h1 class="login-title">鲸鱼娘在线</h1>
      <p class="login-sub">和电脑上的 DSH 聊聊天</p>
      <div class="field">
        <label class="sr-only" for="password">访问密码</label>
        <input class="text-input" id="password" name="password" type="password" placeholder="访问密码"
               autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"
               enterkeyhint="go" required>
      </div>
      <p class="form-error" id="loginError" role="alert" hidden>密码不对</p>
      <button class="primary-btn" id="loginBtn" type="submit">进入</button>
    </form>
    <p class="site-footer">鲸鱼娘在线 · 和电脑上的 DSH 对话</p>
  </section>

  <!-- ===== 聊天页 ===== -->
  <section class="view chat-view" id="chatView" hidden>
    <div class="app-shell">
      <!-- 会话侧栏（手机上变成抽屉） -->
      <aside class="sidebar" id="sidebar" aria-label="会话列表">
        <div class="sidebar-head">
          <button class="new-session-btn" id="newSessionBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
            <span>新建会话</span>
          </button>
        </div>
        <div class="session-list" id="sessionList" role="list"></div>
        <footer class="sidebar-footer">鲸鱼娘在线</footer>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <div class="chat-panel">
        <header class="topbar">
          <div class="topbar-inner">
            <div class="topbar-main">
              <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开会话列表"
                      aria-expanded="false" aria-controls="sidebar">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M3 6h18"/>
                  <path d="M3 12h18"/>
                  <path d="M3 18h18"/>
                </svg>
              </button>
              <h1 class="topbar-title" id="sessionTitle">鲸鱼娘在线</h1>
              <span class="conn-dot" id="connDot" data-state="connecting" role="img"
                    aria-label="状态：连接中" title="状态：连接中"></span>
            </div>
            <div class="topbar-actions">
              <button class="icon-btn" id="infoBtn" type="button" aria-label="会话信息" title="会话信息">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M12 11v5"/>
                  <path d="M12 8h.01"/>
                </svg>
              </button>
              <button class="icon-btn" id="settingsBtn" type="button" aria-label="设置（修改密码）" title="设置">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
              <button class="icon-btn" id="themeBtn" type="button" aria-label="切换到浅色模式" title="切换到浅色模式">
                <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="4"/>
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
              </button>
              <button class="icon-btn" id="logoutBtn" type="button" aria-label="退出登录" title="退出登录">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <path d="m16 17 5-5-5-5"/>
                  <path d="M21 12H9"/>
                </svg>
              </button>
            </div>
          </div>
        </header>

        <div class="agent-banner" id="agentBanner" data-state="offline" hidden>
          <span class="agent-banner-icon" aria-hidden="true">✧</span>
          <span id="agentBannerText">电脑端未连接</span>
        </div>

        <main class="chat-main">
          <div class="messages" id="messages" role="log" aria-live="polite" aria-label="聊天记录" tabindex="-1">
            <div class="messages-inner" id="messagesInner">
              <div class="empty-hint" id="emptyHint">
                <div class="empty-mark" aria-hidden="true">
                  <svg class="whale-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <use href="#whale-icon"></use>
                  </svg>
                </div>
                <p class="empty-title" id="emptyTitle">正在连接…</p>
                <span class="empty-desc" id="emptyDesc">正在连接你的电脑</span>
                <button class="retry-btn" id="retryBtn" type="button" hidden>重试</button>
              </div>
            </div>
          </div>
          <button class="jump-btn" id="jumpBtn" type="button" aria-label="回到最新消息" title="回到最新消息" hidden>
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 5v14"/>
              <path d="m19 12-7 7-7-7"/>
            </svg>
          </button>
        </main>

        <footer class="composer">
          <div class="composer-inner">
            <label class="sr-only" for="input">消息输入框</label>
            <textarea class="composer-input" id="input" rows="1" placeholder="和鲸鱼娘说点什么…" enterkeyhint="send"
                      autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
            <button class="send-btn" id="sendBtn" type="button" aria-label="发送" title="发送" disabled>
              <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M12 19V5"/>
                <path d="m5 12 7-7 7 7"/>
              </svg>
            </button>
          </div>
        </footer>
      </div>
    </div>
  </section>

  <!-- ===== 信息面板（右侧抽屉，可操作） ===== -->
  <div class="drawer-layer" id="infoLayer" hidden>
    <div class="drawer-backdrop" id="infoBackdrop"></div>
    <aside class="info-panel" id="infoPanel" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <div class="info-head">
        <div class="info-heading">
          <h2 class="info-title" id="infoTitle">会话信息</h2>
          <p class="info-sub" id="infoSubtitle"></p>
        </div>
        <button class="icon-btn modal-close" id="infoClose" type="button" aria-label="关闭信息面板">×</button>
      </div>
      <div class="info-body" id="infoBody"></div>
    </aside>
  </div>

  <!-- ===== 新建会话（项目选择） ===== -->
  <div class="modal-layer" id="createModal" hidden>
    <div class="modal-backdrop" id="createBackdrop"></div>
    <div class="modal-card create-card" role="dialog" aria-modal="true" aria-labelledby="createTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="createTitle">新建会话</h2>
        <button class="icon-btn modal-close" id="createClose" type="button" aria-label="关闭">×</button>
      </div>
      <p class="modal-sub">选择在哪个项目中开始</p>
      <div class="project-list" id="projectList"></div>
      <p class="form-error" id="createError" role="alert" hidden></p>
    </div>
  </div>

  <!-- ===== 设置（修改密码） ===== -->
  <div class="modal-layer" id="settingsModal" hidden>
    <div class="modal-backdrop" id="settingsBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="settingsTitle">设置</h2>
        <button class="icon-btn modal-close" id="settingsClose" type="button" aria-label="关闭设置">×</button>
      </div>
      <p class="modal-sub">修改登录密码</p>
      <form class="pwd-form" id="passwordForm" novalidate>
        <label class="modal-field">
          <span class="modal-label">原密码</span>
          <input class="text-input" id="oldPassword" type="password" placeholder="原密码"
                 autocomplete="current-password" required>
        </label>
        <label class="modal-field">
          <span class="modal-label">新密码</span>
          <input class="text-input" id="newPassword" type="password" placeholder="至少 8 位"
                 autocomplete="new-password" required>
        </label>
        <label class="modal-field">
          <span class="modal-label">确认新密码</span>
          <input class="text-input" id="confirmPassword" type="password" placeholder="再输入一次"
                 autocomplete="new-password" required>
        </label>
        <p class="form-error" id="passwordError" role="alert" hidden></p>
        <p class="form-success" id="passwordSuccess" role="status" hidden>密码已修改</p>
        <div class="modal-actions">
          <button class="ghost-btn" id="passwordCancel" type="button">取消</button>
          <button class="primary-btn modal-submit" id="passwordSubmit" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>

  <script src="app.js?v=5"></script>
</body>
</html>
