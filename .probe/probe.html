<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>probe</title>
</head>
<body>
  <div id="login-view" class="login-view" hidden>
    <form id="login-form"><input id="login-password"><input id="login-confirm"><p id="login-error"></p><button id="login-submit" type="submit"></button></form>
  </div>
  <div id="main-view" hidden>
    <header class="topbar">
      <a id="brand-link" href="#/wall"><span class="brand-mark"></span></a>
      <button id="new-project-btn" type="button">新建项目</button>
      <button id="logout-btn" type="button">退出</button>
    </header>
    <div id="wall-view">
      <input id="search-input">
      <div id="type-nav"></div><div id="tag-filter"></div>
      <h1 id="wall-title"></h1><p id="wall-count"></p>
      <div id="project-grid"></div><div id="wall-empty" hidden></div>
    </div>
    <div id="detail-view" hidden></div>
  </div>
  <div id="modal-root" hidden></div>
  <div id="toast-root"></div>
  <pre id="probe-log"></pre>
  <script src="probe-stub.js"></script>
  <script src="../studio/static/app.js"></script>
  <script src="probe-run.js"></script>
</body>
</html>
