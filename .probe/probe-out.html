<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <title>probe</title>
</head>
<body>
  <div id="login-view" class="login-view">
    <form id="login-form"><input id="login-password"><input id="login-confirm"><p id="login-error"></p><button id="login-submit" type="submit"></button></form>
  </div>
  <div id="main-view" hidden="">
    <header class="topbar">
      <a id="brand-link" href="#/wall"><span class="brand-mark"></span></a>
      <button id="new-project-btn" type="button">新建项目</button>
      <button id="logout-btn" type="button">退出</button>
    </header>
    <div id="wall-view">
      <input id="search-input">
      <div id="type-nav"></div><div id="tag-filter"></div>
      <h1 id="wall-title"></h1><p id="wall-count"></p>
      <div id="project-grid"></div><div id="wall-empty" hidden=""></div>
    </div>
    <div id="detail-view" hidden=""></div>
  </div>
  <div id="modal-root" hidden=""></div>
  <div id="toast-root"></div>
  <pre id="probe-log"></pre>
  <script>
    window.__calls = [];
    window.__errors = [];
    window.addEventListener('error', function (e) { window.__errors.push('ERROR ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) { window.__errors.push('REJECT ' + (e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });

    var MODULES = {
      ok: true,
      modules: {
        meta: { label: '基本信息', types: ['*'], fields: [{ key: 'status', label: '状态', type: 'select', options: [{value:'构思',label:'构思'}] }, { key: 'progress', label: '进度', type: 'number' }] },
        audio: { label: '编曲参数', types: ['music'], fields: [{ key: 'bpm', label: 'BPM', type: 'number' }] },
        lyrics: { label: '歌词', types: ['music','lyrics'], fields: [{ key: 'lyrics', label: '歌词正文', type: 'textarea', rows: 14, mono: true }] },
        chords: { label: '和弦进行', types: ['music'], fields: [{ key: 'chords', label: '和弦', type: 'textarea' }] },
        sections: { label: '片段 / 段落', types: ['music','video','story'], fields: [] },
        shots: { label: '镜头标记', types: ['video'], fields: [] },
        script: { label: '分镜脚本', types: ['video'], fields: [] },
        palette: { label: '配色', types: ['art','oc'], fields: [] },
        outline: { label: '大纲', types: ['story','world'], fields: [] },
        characters: { label: '角色', types: ['story','world','oc'], fields: [] },
        worldbuilding: { label: '世界观设定', types: ['world'], fields: [] },
        timeline: { label: '时间线', types: ['story','world'], fields: [] },
        code: { label: '代码片段', types: ['code'], fields: [] },
        notes: { label: '笔记', types: ['*'], fields: [] },
        references: { label: '参考资料', types: ['*'], fields: [] }
      },
      defaults: {
        music: ['meta','audio','lyrics','chords','sections'], lyrics: ['meta','lyrics'],
        art: ['meta','palette'], code: ['meta','code'], video: ['meta','sections','shots','script'],
        story: ['meta','outline','sections','characters'], world: ['meta','outline','worldbuilding','characters','timeline'],
        oc: ['meta','palette','characters'], other: ['meta','notes']
      }
    };

    function jsonResponse(obj, status) {
      return Promise.resolve(new Response(JSON.stringify(obj), {
        status: status || 200,
        headers: { 'Content-Type': 'application/json' }
      }));
    }

    window.__origFetch = window.fetch;
    window.fetch = function (url, init) {
      var method = (init && init.method) || 'GET';
      var body = init && init.body ? String(init.body) : '';
      window.__calls.push(method + ' ' + url + (body ? ' BODY=' + body : ''));
      var u = String(url);
      if (u.indexOf('/api/setup-state') === 0) return jsonResponse({ ok: true, needsSetup: false });
      if (u.indexOf('/api/me') === 0) return jsonResponse({ ok: true, authed: true });
      if (u.indexOf('/api/modules') === 0) return jsonResponse(MODULES);
      if (u.indexOf('/api/projects') === 0 && method === 'GET') return jsonResponse({ ok: true, projects: [] });
      if (u.indexOf('/api/projects') === 0 && method === 'POST') {
        var payload = {};
        try { payload = JSON.parse(body); } catch (e) { payload = { __parseError: body }; }
        var id = 'p-20261108-probe';
        return jsonResponse({ ok: true, project: {
          id: id, name: payload.name || '', type: payload.type || 'other',
          createdAt: '2026-11-08T09:00:00Z', updatedAt: '2026-11-08T09:00:00Z',
          tags: payload.tags || [], summary: '', modules: payload.modules || ['meta'],
          fields: {}, sections: []
        } });
      }
      return jsonResponse({ ok: true });
    };

    function later(fn, ms) { setTimeout(fn, ms); }

    function log(msg) {
      var el = document.getElementById('probe-log');
      el.textContent += msg + '\n';
    }

    function runProbe() {
      log('=== after init: hash=' + location.hash);
      log('modal hidden=' + document.getElementById('modal-root').hidden);
      log('errors: ' + JSON.stringify(window.__errors));
      var newBtn = document.getElementById('new-project-btn');
      log('newBtn present=' + !!newBtn);
      newBtn.click();
      later(function () {
        log('--- after new-project click ---');
        var root = document.getElementById('modal-root');
        log('modal hidden=' + root.hidden);
        log('modal html tags=' + Array.prototype.map.call(root.querySelectorAll('*'), function (n) { return n.tagName + (n.className ? '.' + String(n.className).replace(/ /g, '.') : ''); }).join(' | '));
        var modal = root.querySelector('.modal');
        log('modal children=' + (modal ? modal.children.length : 'none'));
        log('all inputs=' + Array.prototype.map.call(root.querySelectorAll('input,select,textarea,button'), function (n) {
          return n.tagName + '[type=' + (n.type || '') + '][value=' + (n.value || '') + ']' + (n.textContent ? ' text=' + n.textContent : '');
        }).join(' ; '));
        var nameInput = root.querySelector('input[type="text"]');
        if (nameInput) { nameInput.value = '鲸落'; log('nameInput set, value=' + nameInput.value); }
        else log('NO NAME INPUT');
        log('errors after open: ' + JSON.stringify(window.__errors));
        var btns = Array.prototype.slice.call(root.querySelectorAll('.modal-actions button'));
        log('action buttons=' + btns.map(function (b) { return b.textContent + '/' + b.className; }).join(' ; '));
        var okBtn = null;
        btns.forEach(function (b) { if (b.className.indexOf('btn-primary') >= 0) okBtn = b; });
        if (!okBtn) { log('NO OK BUTTON'); return; }
        log('clicking ok: ' + okBtn.textContent + ' disabled=' + okBtn.disabled);
        okBtn.click();
        later(function () {
          log('--- after create click ---');
          log('calls: ' + JSON.stringify(window.__calls));
          log('errors: ' + JSON.stringify(window.__errors));
          log('modal hidden=' + root.hidden);
          log('error text=' + JSON.stringify((root.querySelector('.form-error') || {}).textContent || '(gone)'));
          log('toasts=' + JSON.stringify(Array.prototype.map.call(document.querySelectorAll('.toast'), function (t) { return t.textContent; })));
          log('hash=' + location.hash);
          log('detail-view hidden=' + document.getElementById('detail-view').hidden);
          log(done());
        }, 900);
      }, 500);
    }

    function done() {
      var el = document.createElement('div');
      el.id = 'probe-done';
      el.textContent = 'DONE';
      document.body.appendChild(el);
      return 'DONE';
    }
  </script>
  <script src="../studio/static/app.js"></script>
  <script>
    setTimeout(runProbe, 300);
  </script>


</body></html>
