<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEHE · 代码仓库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a2e58'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%237fd8f0' font-family='monospace'%3Egit%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #0a2e58;
      --dim: #5b6f8c;
      --accent: #2f7fb8;
      --paper: #f7fbfc;
      --line: rgba(10, 46, 88, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.75;
    }
    .card {
      width: 100%;
      max-width: 620px;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 32px;
      background: #fff;
      box-shadow: 0 24px 60px -34px rgba(10, 46, 88, 0.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -0.01em; }
    .sub { margin: 0 0 28px; color: var(--dim); font-size: 0.9rem; }
    h2 {
      margin: 26px 0 10px;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      font-weight: 600;
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86rem;
    }
    pre {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: #0a2e58;
      color: #d7f0f7;
      overflow-x: auto;
      line-height: 1.6;
    }
    a { color: var(--accent); }
    .foot {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 0.82rem;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>HEHE · 代码仓库</h1>
    <p class="sub">这个站点的源码放在这台服务器上，公开可克隆，推送走 SSH。</p>

    <h2>克隆</h2>
    <pre>git clone https://git.hopzz.top/hopzz-site.git</pre>

    <h2>仓库</h2>
    <p><a href="/hopzz-site.git/info/refs?service=git-upload-pack">hopzz-site.git</a></p>

    <h2>推送（限自己）</h2>
    <pre>git remote add vps vps:/srv/git/hopzz-site.git
git push vps main</pre>

    <p class="foot">hopzz.top · ai.hopzz.top · git.hopzz.top</p>
  </main>
</body>
</html>
