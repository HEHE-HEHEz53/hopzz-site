# =====================================================================
# git.hopzz.top —— 自建 git 仓库（只读公开克隆，推送走 SSH）
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name git.hopzz.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name git.hopzz.top;

    ssl_certificate     /etc/letsencrypt/live/git.hopzz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.hopzz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    ssl_session_cache shared:SSL:10m;

    root /srv/git-www;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    # 首页：给人看的说明页
    location = / {
        try_files /index.html =404;
    }

    # 其余全部交给 git-http-backend（支持 clone / fetch）
    location ~ ^/(.+)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param PATH_INFO /$1;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        fastcgi_read_timeout 120s;
    }
}
