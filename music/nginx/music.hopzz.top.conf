server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music.hopzz.top;

    ssl_certificate     /etc/letsencrypt/live/music.hopzz.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.hopzz.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy same-origin always;

    # 音频不允许被当成下载文件

    client_max_body_size 32m;

    # 音频流：不缓冲、支持 Range、禁止缓存
    location /api/audio/ {
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_max_temp_file_size 0;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name music.hopzz.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
