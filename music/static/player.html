<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f4f1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="copyright" content="© 2026 HEHEz53. All rights reserved.">
  <meta name="author" content="HEHEz53">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f4f1ec'/%3E%3Cpath d='M9 6.5v11l8-5.5z' fill='%232b2622'/%3E%3C/svg%3E">
  <title>不器用なピアノ</title>
  <link rel="stylesheet" href="/static/player.css?v=2">
</head>
<body>
  <div class="wash" id="wash" aria-hidden="true"></div>

  <main class="app" id="app">
    <!-- 手机端展开后的顶栏：小封面 + 歌名 -->
    <header class="topbar" id="topbar">
      <img class="topbar-cover" id="topbarCover" alt="" draggable="false">
      <div class="topbar-text">
        <p class="topbar-title" id="topbarTitle"></p>
        <p class="topbar-artist" id="topbarArtist"></p>
      </div>
      <button class="icon-btn" id="collapseBtn" type="button" aria-label="收起歌词" title="收起">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
    </header>

    <!-- 封面 / 信息 / 手机端两行歌词 -->
    <section class="stage" id="stage">
      <div class="cover-wrap">
        <img class="cover" id="cover" alt="" draggable="false">
      </div>
      <div class="meta">
        <h1 class="title" id="title"></h1>
        <p class="artist" id="artist"></p>
      </div>
      <div class="mini" id="mini" role="button" tabindex="0" aria-label="展开歌词">
        <p class="mini-line" id="miniLine1"></p>
        <p class="mini-line" id="miniLine2"></p>
      </div>
    </section>

    <!-- 完整歌词 -->
    <section class="lyrics" id="lyrics" aria-label="歌词">
      <div class="lyrics-inner" id="lyricsInner"></div>
    </section>

    <!-- 底部：进度 + 控制 -->
    <footer class="bottom">
      <div class="progress" id="progress" role="slider" tabindex="0"
           aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="times">
        <span id="timeNow">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>

      <div class="controls">
        <button class="icon-btn" id="backBtn" type="button" aria-label="后退 10 秒" title="后退 10 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6 5 12l6 6"/><path d="M19 6v12"/></svg>
        </button>

        <button class="play" id="playBtn" type="button" aria-label="播放" title="播放">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 5.6c0-.9 1-1.4 1.7-.9l9.2 6.4c.6.4.6 1.4 0 1.8L10.2 19.3c-.7.5-1.7 0-1.7-.9V5.6z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.6"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.6"/></svg>
          <span class="spinner" id="spinner"></span>
        </button>

        <button class="icon-btn" id="fwdBtn" type="button" aria-label="前进 10 秒" title="前进 10 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l6 6-6 6"/><path d="M5 6v12"/></svg>
        </button>

        <div class="volume" id="volumeWrap">
          <button class="icon-btn small" id="muteBtn" type="button" aria-label="静音" title="静音">
            <svg class="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path class="vol-wave" d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path class="vol-wave2" d="M18 7a7.5 7.5 0 0 1 0 10"/></svg>
            <svg class="i-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></svg>
          </button>
          <input class="vol" id="volume" type="range" min="0" max="100" value="85" aria-label="音量">
        </div>

        <button class="icon-btn" id="moreBtn" type="button" aria-label="更多" title="更多" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <!-- 更多菜单 -->
  <div class="menu" id="menu" role="menu" hidden>
    <button class="menu-item" id="transBtn" role="menuitemcheckbox" aria-checked="false" type="button">
      <span>中文翻译</span>
      <span class="switch" id="transSwitch"></span>
    </button>
    <div class="menu-sep" role="separator"></div>
    <p class="menu-label">播放速度</p>
    <div class="speeds" id="speeds">
      <button class="speed" data-rate="0.75" type="button">0.75×</button>
      <button class="speed is-on" data-rate="1" type="button">1×</button>
      <button class="speed" data-rate="1.25" type="button">1.25×</button>
      <button class="speed" data-rate="1.5" type="button">1.5×</button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="/static/player.js?v=2" defer></script>
</body>
</html>
