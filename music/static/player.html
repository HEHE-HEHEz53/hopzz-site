<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ec">
  <meta name="robots" content="noindex, nofollow">
  <title>不器用なピアノ · HEHEz53</title>
  <link rel="stylesheet" href="/static/player.css?v=1">
</head>
<body>
  <div class="paper" aria-hidden="true"></div>

  <main class="player" id="player">
    <section class="art">
      <div class="cover-wrap">
        <img class="cover" id="cover" alt="专辑封面" draggable="false">
        <span class="cover-veil" aria-hidden="true"></span>
      </div>
      <p class="signature" id="signature">HEHEz53</p>
    </section>

    <section class="body">
      <header class="head">
        <p class="kicker" id="kicker">now playing</p>
        <h1 class="title" id="title">载入中…</h1>
        <p class="artist" id="artist"></p>
      </header>

      <div class="progress-block">
        <div class="progress" id="progress" role="slider" tabindex="0"
             aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="times">
          <span id="timeNow">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="backBtn" type="button" aria-label="后退 10 秒" title="后退 10 秒">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 4 12l7 7"/><path d="M20 5v14"/></svg>
        </button>
        <button class="play" id="playBtn" type="button" aria-label="播放" title="播放">
          <svg class="i-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" hidden><rect x="7" y="5" width="3.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"/></svg>
          <span class="spinner" id="spinner" hidden></span>
        </button>
        <button class="ctrl" id="fwdBtn" type="button" aria-label="前进 10 秒" title="前进 10 秒">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l7 7-7 7"/><path d="M4 5v14"/></svg>
        </button>
        <div class="volume">
          <button class="ctrl tiny" id="muteBtn" type="button" aria-label="静音" title="静音">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h3l5 4V5L7 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
          <input class="vol" id="volume" type="range" min="0" max="100" value="82" aria-label="音量">
        </div>
      </div>

      <section class="lyrics-panel">
        <div class="lyrics-head">
          <span>歌词</span>
          <span class="lyrics-hint">点击任意一句跳转</span>
        </div>
        <div class="lyrics" id="lyrics" tabindex="0" aria-label="歌词，可用方向键或滚轮浏览">
          <p class="lyrics-empty" id="lyricsEmpty">这首歌暂无歌词</p>
        </div>
      </section>
    </section>
  </main>

  <footer class="foot">
    <span>仅供在线收听 · 未经授权请勿转载</span>
    <span id="licNote">© HEHEz53</span>
  </footer>

  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  <script src="/static/player.js?v=1" defer></script>
</body>
</html>
